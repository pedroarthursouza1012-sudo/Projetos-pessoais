<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calc_JS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bellota+Text:ital,wght@0,300;0,400;0,700;1,300;1,400;1,700&family=Cal+Sans&family=Josefin+Sans:ital,wght@0,100..700;1,100..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Calculadora</h1> 
    <div id="display"></div>
    <div id="calculadora">
       
        <button class="tecla">7</button >
        <button class="tecla">8</button>
        <button class="tecla">9</button><br>
        <button class="tecla">4</button>
        <button class="tecla">5</button>
        <button class="tecla">6</button><br>
        <button class="tecla">1</button>
        <button class="tecla">2</button>
        <button class="tecla">3</button><br>
        <button class="tecla">0</button><br><br>
        <button class="tecla">C</button>
        <button class="tecla">=</button>
        <button class="tecla">+</button>
        <button class="tecla">-</button>
        <button class="tecla">X</button>
        <button class="tecla">/</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
